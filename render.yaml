# Render Blueprint: Docker web service. Health checks /health; index ships in the image.
services:
  - type: web
    name: phoenix-rag
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
        optional: true
